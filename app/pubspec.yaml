name: vibe_app
description: "Vibe — мессенджер нового поколения с постквантовым шифрованием"
publish_to: 'none'
version: 1.6.3+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  record: ^7.1.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  pinput: ^5.0.0
  intl_phone_field: ^3.2.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  supabase_flutter: ^2.6.0
  crypto: ^3.0.3
  camera: ^0.12.0+2
  video_player: ^2.13.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.3.2
  emoji_picker_flutter: ^4.5.3
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: VibeIcons
      fonts:
        - asset: assets/fonts/vibe_icons.ttf
