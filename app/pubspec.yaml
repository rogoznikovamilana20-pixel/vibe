name: vibe_app
description: "Vibe — мессенджер с end-to-end шифрованием (X25519 + AES-256-GCM)"
publish_to: 'none'
version: 1.6.4+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  record: ^7.1.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  pinput: ^5.0.0
  intl_phone_field: ^3.2.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^8.0.3
  go_router: ^14.6.3
  window_manager: ^0.3.8
  local_auth: ^2.3.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.3.0
  supabase_flutter: ^2.6.0
  crypto: ^3.0.3
  camera: ^0.12.0+2
  video_player: ^2.13.0
  qr_flutter: ^4.1.0
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.3.2
  gal: ^2.3.0
  emoji_picker_flutter: ^4.5.3
  connectivity_plus: ^6.1.0
  file_picker: ^11.0.3
  flutter_webrtc: ^0.12.4
  livekit_client: ^2.4.1
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/gifs/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: VibeIcons
      fonts:
        - asset: assets/fonts/vibe_icons.ttf

# Desktop MSIX packaging (Windows) — `dart pub global activate msix && msix:create`
msix_config:
  display_name: Vibe
  publisher_display_name: Vibe Messenger
  identity_name: com.vibe.messenger
  msix_version: 1.6.4.0
  logo_path: assets/icon.png
  start_menu_icon_path: assets/icon.png
  tile_icon_path: assets/icon.png
  icons_background_color: "#0D0A1E"
  architecture: x64
  capabilities: internetClient, microphone, webcam
  languages: ru-ru, en-us
