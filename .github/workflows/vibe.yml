name: vibe-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: analyze + test + apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/android/.gradle
            app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

      - name: verify business_scalable migration present
        run: test -f ../supabase/migrate_v1_25_0_business_scalable.sql && test -f ../app/supabase/migrations/20260827000000_business_scalable.sql && echo "migration OK"

      - name: build apk (debug)
        run: flutter build apk --debug --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: vibe-apk-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error